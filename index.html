<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tasbi Production</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
:root{--bg:#EEF2F0;--surface:#fff;--ink:#12302B;--mute:#5C706B;--line:#D5DEDA;--pay:#A8273B;--rec:#1E7A54;--accent:#E3A21A;--head:#12302B;--headink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1917;--surface:#16262A;--ink:#E8F0ED;--mute:#93A8A2;--line:#27403B;--pay:#F0788A;--rec:#5FD1A0;--head:#16262A}}
:root[data-theme="dark"]{--bg:#0D1917;--surface:#16262A;--ink:#E8F0ED;--mute:#93A8A2;--line:#27403B;--pay:#F0788A;--rec:#5FD1A0;--head:#16262A}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;font-size:15px}
.app{max-width:480px;margin:0 auto;min-height:100vh;position:relative}
header{background:var(--head);color:var(--headink);padding:14px 16px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5}
h1{font:700 19px/1.15 "Bricolage Grotesque",system-ui,sans-serif;margin:0}
header small{display:block;font-size:12px;opacity:.75;font-weight:400;margin-top:2px}
.burger{background:none;border:0;padding:8px;margin:-8px;cursor:pointer;display:grid;gap:5px}
.burger i{display:block;width:22px;height:2.5px;background:var(--accent);border-radius:2px}
.burger:focus-visible,.row:focus-visible,.card:focus-visible,.drawer a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{padding:12px}
h2{font:700 17px "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 12px}
.card{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:16px;margin-bottom:12px;color:inherit;font:inherit;cursor:pointer}
.card span{color:var(--mute);font-size:13px}
.card b{display:block;font:700 28px "Bricolage Grotesque",system-ui,sans-serif;color:var(--c);margin-top:4px}
.card em{font-style:normal;font-size:12px;color:var(--mute)}
.back{background:none;border:0;color:var(--ink);font:600 14px Figtree,sans-serif;padding:0 0 12px;cursor:pointer}
.wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 5px;text-align:left;border-bottom:1px solid var(--line);font-size:12.5px;vertical-align:middle}
th{font-weight:600;color:var(--mute);font-size:13px;background:var(--bg)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
.row{cursor:pointer}.row:hover td{background:var(--bg)}
.row td:first-child{font-weight:600}
td.rm{min-width:60px}
tfoot td{font-weight:700;background:var(--bg)}
.tot{display:flex;justify-content:space-between;margin-top:12px;font-weight:600}
label{display:block;font-weight:600;margin:0 0 14px}
input,select{display:block;width:100%;margin-top:6px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}
.btn{background:var(--accent);color:#2A1D00;border:0;border-radius:10px;padding:13px 18px;font:700 15px Figtree,sans-serif;width:100%;cursor:pointer}
.r1{display:grid;grid-template-columns:1.1fr 1.3fr auto auto;gap:8px;align-items:end;margin-bottom:2px}
.r2{display:grid;grid-template-columns:2.2fr .5fr .6fr 1fr;gap:6px;margin-bottom:2px}
.r1 label,.r2 label{margin-bottom:14px;font-size:13px;min-width:0}
.r1 input,.r1 select,.r2 input,.r2 select{padding:10px 6px;font-size:14px;min-width:0}
.r2 input[readonly]{background:var(--bg);font-weight:700}
.btn.sm{width:auto;padding:10px 11px;font-size:14px;margin-bottom:14px}
.btn.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.sub{display:none}.sub.show{display:block}.sub a{padding-left:46px;font-weight:500}
.cform{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 14px 0;margin-bottom:14px;display:none}.cform.show{display:block}
.cf2{display:grid;grid-template-columns:1.6fr 1fr;gap:8px}
.ckb{display:flex;align-items:center;gap:8px;margin:0;font-weight:600}.ckb input{width:20px;height:20px;margin:0;padding:0;accent-color:var(--accent)}
.mini{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 7px;margin:1px 0;font:600 12px Figtree,sans-serif;cursor:pointer}.mini.del{color:var(--pay);border-color:var(--pay)}
tr.off td{opacity:.55}tr.off td:first-child,tr.off td:last-child{opacity:1}.tag{color:var(--mute);font-size:11px}
.hint{color:var(--mute);font-size:13px;margin:0 0 10px}
.r1.h{grid-template-columns:1fr 1fr auto}
.brow{display:flex;gap:8px}
.r1.l3{grid-template-columns:1fr 1fr 1.3fr;gap:6px}.r1.l3 input,.r1.l3 select{font-size:12px;padding:10px 3px}
.rad{margin:0 0 14px}.rad label{display:inline-flex;align-items:center;gap:6px;margin:0 20px 0 0}.rad input{display:inline-block;width:18px;height:18px;margin:0;padding:0;accent-color:var(--accent)}
.lh{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-bottom:12px}.lh h2{margin:0}.lh .rad{margin:0}.lh .rad label{margin:0 0 0 12px;font-size:13px;font-weight:600}
.row.sel td{background:var(--bg);font-weight:700}
.pos{color:var(--rec);font-weight:700}.neg{color:var(--pay);font-weight:700}
.cap{font-size:12px;color:var(--mute);margin-bottom:2px}.cf2 .rad{margin:0 0 14px}.cf2 .rad label{margin:0 12px 0 0}
.fld{font-weight:600;margin:0 0 14px;font-size:13px;min-width:0}
.sel{display:block;width:100%;margin-top:6px;padding:10px 6px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px;font-weight:400;text-align:left;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel.m,.dd.m{font-weight:700}
.ddl{display:none;position:absolute;left:0;top:100%;min-width:100%;width:max-content;max-width:260px;z-index:6;background:var(--surface);border:1px solid var(--line);border-radius:10px;max-height:220px;overflow:auto;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.ddl.show{display:block}
.dd{padding:10px 12px;font-size:14px;font-weight:400;border-bottom:1px solid var(--line);cursor:pointer}.dd:last-child{border-bottom:0}.dd:hover{background:var(--bg)}
.lh1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.lh1 h2{margin:0}.cdq{font-size:12px;font-weight:600}
.ok{color:var(--rec);font-weight:600;margin-top:12px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:8}
.drawer{position:fixed;top:0;bottom:0;left:0;width:260px;max-width:80%;background:var(--surface);padding:calc(24px + env(safe-area-inset-top,0px)) 0 24px;transform:translateX(-100%);transition:transform .2s;z-index:9}
.open .scrim{opacity:1;pointer-events:auto}.open .drawer{transform:none}
.drawer p{margin:0 20px 14px;font:700 17px "Bricolage Grotesque",sans-serif}
.drawer a{display:block;padding:14px 20px;color:var(--ink);text-decoration:none;font-weight:600;border-left:4px solid transparent;cursor:pointer}
.drawer a.on{border-color:var(--accent);background:var(--bg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
<header>
  <button class="burger" id="bg" aria-label="Open menu"><i></i><i></i><i></i></button>
  <h1>Tasbi Production<small>Dany dhagy me proye jate hain</small></h1>
</header>
<main id="main"></main>
<div class="scrim" id="scrim"></div>
<nav class="drawer" aria-label="Menu">
  <p>Menu</p>
  <a data-go="dash">Dashboard</a>
  <a data-go="prod">Production</a>
  <a data-go="sale">Delivery</a>
  <a data-go="pay">Payment</a>
  <a data-go="ledgers">Ledgers</a>
  <a data-go="profit">Profit Ledger</a>
  <a id="setup" role="button" aria-expanded="false">&#128193; Setup</a>
  <div class="sub" id="sub"><a data-go="cat">Production Rate List</a><a data-go="scat">Delivery Rate List</a><a data-go="names">Name List</a></div>
</nav>
</div>
<script src="db.bundle.js"></script>
<script>
// type: p = we pay them (credit adds), r = they pay us (debit adds). Entries: [date, remarks, credit, debit]
var parties=[
 {id:1,name:"Noor Bibi",t:"p",e:[["02 Sep 2026","500 x 12",6000,0],["14 Sep 2026","-",0,2000],["28 Sep 2026","300 x 5",1500,0]]},
 {id:2,name:"Rahim",t:"p",e:[["10 Sep 2026","400 x 22",8800,0],["30 Sep 2026","-",0,3000]]},
 {id:3,name:"Haji Traders",t:"r",e:[["03 Sep 2026","200 x 18",0,3600],["18 Sep 2026","-",1500,0],["01 Oct 2026","100 x 30",0,3000]]},
 {id:4,name:"Madina Store",t:"r",e:[["12 Sep 2026","150 x 30",0,4500],["25 Sep 2026","-",2000,0]]}
];
function toIso(t){var a=t.split(" "),m=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"].indexOf(a[1])+1;return a[2]+"-"+String(m).padStart(2,"0")+"-"+a[0]}
parties.forEach(function(p){p.e.forEach(function(x){x[5]=toIso(x[0])})});
function bal(p){return p.e.reduce(function(s,x){return s+(p.t=="p"?x[2]-x[3]:x[3]-x[2])},0)}
function sum(t){return parties.filter(function(p){return p.t==t}).reduce(function(s,p){return s+bal(p)},0)}
function rs(n){return "Rs "+n.toLocaleString("en-PK")}
var M=document.getElementById("main"),A=document.getElementById("app");
function setOn(k){document.querySelectorAll(".drawer a[data-go]").forEach(function(a){a.classList.toggle("on",a.dataset.go==k)});if(k=="cat"||k=="scat"||k=="names")document.getElementById("sub").classList.add("show")}
function show(v,arg){
  A.classList.remove("open");window.scrollTo(0,0);
  if(v=="dash")dash();else if(v=="list")list(arg);else if(v=="ledger")ledger(arg);else if(v=="cat"||v=="scat"){cl=v=="scat"?"s":"p";openCat()}else if(v=="names"){nameForm=false;nameEdit=null;nameArm=null;nameMsg="";namesPage()}else if(v=="prod"||v=="sale"){pv.kind=v=="sale"?"s":"p";pv.mode="add";pv.edit=null;pv.msg="";pv.arm=null;prod()}else if(v=="pay"){py.mode="add";py.edit=null;py.msg="";py.arm=null;pay()}else if(v=="profit"){profitPage()}else if(v=="ledgers")all();
  setOn(v=="names"?"names":v=="scat"?"scat":v=="cat"?"cat":v=="dash"?"dash":v=="prod"?"prod":v=="sale"?"sale":v=="pay"?"pay":v=="profit"?"profit":(v=="ledgers"||v=="ledger")?"ledgers":"");
}
function totalProfit(){return prods.filter(function(x){return x.kind=="s"}).reduce(function(a,x){return a+x.t-Math.round(x.q*costRate(x.k,x.iso))},0)}
function dash(){var tp=totalProfit();
  M.innerHTML='<h2>Dashboard</h2>'+
  '<button class="card" style="--c:var(--pay)" data-v="list" data-a="p"><span>Total payable</span><b>'+rs(sum("p"))+'</b><em>Tap to see who we have to pay</em></button>'+
  '<button class="card" style="--c:var(--rec)" data-v="list" data-a="r"><span>Total receivable</span><b>'+rs(sum("r"))+'</b><em>Tap to see who owes us</em></button>'+
  '<button class="card" style="--c:'+(tp<0?"var(--pay)":"var(--rec)")+'" data-v="profit"><span>Total profit</span><b>'+rs(tp)+'</b><em>Tap to see profit ledger</em></button>';
}
function list(t){
  var ps=parties.filter(function(p){return p.t==t}),pay=t=="p";
  M.innerHTML='<button class="back" data-v="dash">&larr; Dashboard</button><h2>'+(pay?"Payable: whom we have to pay":"Receivable: who owes us")+'</h2>'+
  '<div class="wrap"><table><thead><tr><th>'+(pay?"Pay to":"Receive from")+'</th><th class="n">Amount</th></tr></thead><tbody>'+
  ps.map(function(p){return '<tr class="row" tabindex="0" data-v="ledger" data-a="'+p.id+'"><td>'+p.name+'</td><td class="n">'+rs(bal(p))+'</td></tr>'}).join("")+
  '</tbody><tfoot><tr><td>Total</td><td class="n">'+rs(sum(t))+'</td></tr></tfoot></table></div>';
}
var lv={from:"",to:"",aid:1,back:null,mode:"amt",cat:null};
function defDates(){var n=new Date();lv.from=iso(new Date(n.getFullYear(),n.getMonth()-1,1));lv.to=iso(n)}
function ledger(id){var p=parties.filter(function(x){return x.id==id})[0];lv.mode="amt";lv.cat=null;lv.clr=false;lv.note="";lv.aid=p.id;lv.back=p.t;defDates();ledgerPage()}
function all(){lv.back=null;lv.aid=0;lv.mode="amt";lv.cat=null;lv.clr=false;lv.note="";defDates();ledgerPage()}
function fb(p,v){var a=Math.abs(v).toLocaleString("en-PK");if(v==0)return a;return a+((p.t=="r")==(v>0)?" Dr.":" Cr.")}
function ledgerPage(){
  M.innerHTML=(lv.back?'<button class="back" data-v="list" data-a="'+lv.back+'">&larr; '+(lv.back=="p"?"Payable":"Receivable")+'</button>':'')+'<div class="lh"><div class="lh1"><h2>Ledger</h2><span id="cdw"></span></div><div class="rad" role="radiogroup"><label><input type="radio" name="lm" value="amt"'+(lv.mode=="amt"?" checked":"")+'> Amount Ledger</label><label><input type="radio" name="lm" value="qty"'+(lv.mode=="qty"?" checked":"")+'> Qty Ledger</label></div></div>'+
  '<div class="r1 l3"><label>From date<input id="lf" type="date" value="'+lv.from+'"></label><label>To date<input id="lt" type="date" value="'+lv.to+'"></label><label>Account name<select id="la">'+'<option value="">Select account</option>'+parties.map(function(p){return '<option value="'+p.id+'"'+(p.id==lv.aid?' selected':'')+'>'+p.name+'</option>'}).join("")+'</select></label></div><div id="ll"></div>';
  ledgerList();
}
function qtyList(el,p,f,t){
  var list=prods.filter(function(x){return x.aid==p.id&&x.iso>=f&&x.iso<=t});
  var g={},order=[];
  list.forEach(function(x){if(!g[x.k]){g[x.k]={q:0,d:x.iso};order.push(x.k)}g[x.k].q+=x.q;if(x.iso>g[x.k].d)g[x.k].d=x.iso});
  var rows=order.length?order.map(function(k){var o=g[k],c=(p.t=="r"?scats:cats).filter(function(z){return z.name==k})[0];return '<tr class="row'+(lv.cat===k?' sel':'')+'" tabindex="0" data-qk="'+esc(k)+'"><td>'+(c?c.id:"-")+'</td><td>'+esc(k)+'</td><td class="n">'+o.q.toLocaleString("en-PK")+'</td></tr>'}).join(""):'<tr><td colspan="3">No production between these dates.</td></tr>';
  var tq=order.reduce(function(a,k){return a+g[k].q},0);
  var h='<div class="wrap"><table><thead><tr><th>Id</th><th>Category</th><th class="n">Total qty</th></tr></thead><tbody>'+rows+'</tbody>'+(order.length?'<tfoot><tr><td colspan="2">Total</td><td class="n">'+tq.toLocaleString("en-PK")+'</td></tr></tfoot>':'')+'</table></div>';
  if(order.length)h+='<p class="hint" style="margin-top:8px">Tap a category to see its details date wise.</p>';
  if(lv.cat&&g[lv.cat]){
    var dl=list.filter(function(x){return x.k==lv.cat}).sort(function(a,b){return a.iso<b.iso?-1:a.iso>b.iso?1:a.id-b.id});
    var tt=dl.reduce(function(a,x){return a+x.t},0);
    h+='<h2 style="margin:14px 0 8px">'+esc(lv.cat)+': details</h2><div class="wrap"><table><thead><tr><th>Date</th><th class="n">Qty</th><th class="n">Price</th><th class="n">Total</th></tr></thead><tbody>'+
    dl.map(function(x){return '<tr><td>'+fdS(x.iso)+'</td><td class="n">'+x.q.toLocaleString("en-PK")+'</td><td class="n">'+x.p.toLocaleString("en-PK")+'</td><td class="n">'+x.t.toLocaleString("en-PK")+'</td></tr>'}).join("")+
    '</tbody><tfoot><tr><td>Total</td><td class="n">'+g[lv.cat].q.toLocaleString("en-PK")+'</td><td></td><td class="n">'+tt.toLocaleString("en-PK")+'</td></tr></tfoot></table></div>';
  }
  el.innerHTML=h;
}
function cdRender(){
  var w=document.getElementById("cdw");if(!w)return;
  if(!lv.aid){w.innerHTML="";lv.clr=false;return}
  var p=parties.filter(function(x){return x.id==lv.aid})[0];
  w.innerHTML=lv.clr?'<span class="cdq">Clear all data of '+esc(p.name)+'?</span><button class="mini del" data-act="cdy">Yes</button><button class="mini" data-act="cdn">No</button>':(lv.note?'<span class="ok" style="margin:0">'+esc(lv.note)+'</span>':'')+'<button class="mini del" id="cdb">Clear Data</button>';
}
function ledgerList(){
  var el=document.getElementById("ll");cdRender();if(!lv.aid){el.innerHTML="";return}
  var p=parties.filter(function(x){return x.id==lv.aid})[0],f=lv.from||"0000-01-01",t=lv.to||"9999-12-31";
  if(f>t){el.innerHTML='<p style="color:var(--pay)">From date must be on or before To date.</p>';return}
  if(lv.mode=="qty"){qtyList(el,p,f,t);return}
  var arr=p.e.map(function(x,i){return {x:x,i:i}}).sort(function(a,b){return a.x[5]<b.x[5]?-1:a.x[5]>b.x[5]?1:a.i-b.i});
  var run=0,hasOpen=false,tc=0,tdb=0,rows="";
  arr.forEach(function(o,n){var x=o.x,d=p.t=="p"?x[2]-x[3]:x[3]-x[2];
    if(x[5]<f){run+=d;hasOpen=true;return}
    if(x[5]>t)return;
    run+=d;tc+=x[2];tdb+=x[3];
    rows+='<tr><td>'+(n+1)+'</td><td>'+fdS(x[5])+'</td><td class="rm">'+x[1]+'</td><td class="n">'+(x[2]?x[2].toLocaleString("en-PK"):"-")+'</td><td class="n">'+(x[3]?x[3].toLocaleString("en-PK"):"-")+'</td><td class="n">'+fb(p,run)+'</td></tr>'});
  if(hasOpen){var ob=0;arr.forEach(function(o){if(o.x[5]<f)ob+=p.t=="p"?o.x[2]-o.x[3]:o.x[3]-o.x[2]});rows='<tr><td>-</td><td>'+fdS(f)+'</td><td class="rm">Opening balance</td><td class="n">-</td><td class="n">-</td><td class="n">'+fb(p,ob)+'</td></tr>'+rows}
  if(!rows)rows='<tr><td colspan="6">No entries between these dates.</td></tr>';
  el.innerHTML='<div class="wrap"><table><thead><tr><th>Id</th><th>Date</th><th>Details</th><th class="n">Credit</th><th class="n">Debit</th><th class="n">Balance</th></tr></thead><tbody>'+rows+'</tbody><tfoot><tr><td colspan="3">Total</td><td class="n">'+tc.toLocaleString("en-PK")+'</td><td class="n">'+tdb.toLocaleString("en-PK")+'</td><td class="n">'+fb(p,run)+'</td></tr></tfoot></table></div>'+
  '<div class="tot"><span>'+(p.t=="p"?"We have to pay":"They owe us")+'</span><span>Rs '+fb(p,run)+'</span></div>';
}
var cats=[{id:1,name:"33 dany",price:5},{id:2,name:"100 dany",price:12},{id:3,name:"200 dany",price:22},{id:4,name:"500 dany",price:50},{id:5,name:"1000 dany",price:95}];
var scats=[{id:1,name:"33 dany",price:8},{id:2,name:"100 dany",price:18},{id:3,name:"200 dany",price:30},{id:4,name:"500 dany",price:70},{id:5,name:"1000 dany",price:130}];
var cl="p";
function CL(){return cl=="s"?scats:cats}
function setCL(a){if(cl=="s")scats=a;else cats=a}
function catPrice(n,sale){var c=(sale?scats:cats).filter(function(x){return x.name==n})[0];return c?c.price:0}
var formOpen=false,editId=null,delArm=null;
var nameForm=false,nameEdit=null,nameArm=null,nameMsg="";
function openAmt(p){var o=p.e.filter(function(x){return x[4]=="open"})[0];return o?(o[2]||o[3]):0}
function openSide(p){var o=p.e.filter(function(x){return x[4]=="open"})[0];return o?(o[2]?"cr":"dr"):null}
function namesPage(){
  var ec=nameEdit!=null?parties.filter(function(p){return p.id==nameEdit})[0]:null;
  var side=ec?ec.t:"p",amt=ec&&openAmt(ec)?openAmt(ec):"",oside=ec?(openSide(ec)||(ec.t=="p"?"cr":"dr")):"cr";

      en2.aid=aid;en2.iso=dv;en2.n=p.name;en2.k=k;en2.q=q;en2.p=pr;en2.t=tot;en2.rm=rm;
      pv.mode="hist";pv.edit=null;pv.msg=lb+" updated. "+p.name+(sale?" receivable":" payable")+" is now "+rs(bal(p))+".";prod();return;
    }
    var id=++nid;led.push(id,dv);p.e.push(led);
    prods.unshift({id:id,kind:pv.kind,aid:aid,iso:dv,n:p.name,k:k,q:q,p:pr,t:tot,rm:rm});
    m.innerHTML='<p class="ok">'+lb+' saved. '+p.name+(sale?' receivable':' payable')+' is now '+rs(bal(p))+'.</p>';
    ["pq","pr"].forEach(function(i){document.getElementById(i).value=""});document.getElementById("pt").value="0";return;
  }
  if(e.target.id=="yh"){py.mode="hist";py.msg="";py.arm=null;pay();return}
  if(e.target.id=="yb"){py.mode="add";py.edit=null;py.msg="";pay();return}
  if(e.target.id=="ycn"){py.mode="hist";py.edit=null;pay();return}
  if(ac=="ye"){py.edit=+e.target.dataset.id;py.mode="add";py.arm=null;py.msg="";pay();return}
  if(ac=="ydl"){var yid=+e.target.dataset.id;
    if(py.arm==yid){var ye=pays.filter(function(x){return x.id==yid})[0],yo=parties.filter(function(x){return x.id==ye.aid})[0];
      yo.e=yo.e.filter(function(x){return x[4]!="y"+yid});pays=pays.filter(function(x){return x.id!=yid});py.arm=null;py.msg="Payment deleted. "+yo.name+(yo.t=="p"?" payable":" receivable")+" is now "+rs(bal(yo))+"."}
    else{py.arm=yid;py.msg=""}
    payList();return}
  if(e.target.id=="ys"){
    var ym=document.getElementById("ym"),yv=document.getElementById("yd").value,ya=+document.getElementById("ya").value,yaid=+document.getElementById("yc").value;
    if(!yaid){ym.innerHTML='<p style="color:var(--pay)">Select an account first.</p>';return}
    if(!yv||!ya||ya<1){ym.innerHTML='<p style="color:var(--pay)">Enter date and amount to save.</p>';return}
    var yp=parties.filter(function(x){return x.id==yaid})[0],yrm=document.getElementById("yr").value.trim(),yl;
    function mk(id){return [fd(yv),"-",yp.t=="p"?0:ya,yp.t=="p"?ya:0,"y"+id,yv]}
    if(py.edit!=null){
      var y2=pays.filter(function(x){return x.id==py.edit})[0],yold=parties.filter(function(x){return x.id==y2.aid})[0];yl=mk(y2.id);
      if(yold.id==yp.id){yold.e=yold.e.map(function(x){return x[4]=="y"+y2.id?yl:x})}else{yold.e=yold.e.filter(function(x){return x[4]!="y"+y2.id});yp.e.push(yl)}
      y2.aid=yaid;y2.iso=yv;y2.n=yp.name;y2.amt=ya;y2.rm=yrm;
      py.mode="hist";py.edit=null;py.msg="Payment updated. "+yp.name+(yp.t=="p"?" payable":" receivable")+" is now "+rs(bal(yp))+".";pay();return;
    }
    var yn=++pyid;yp.e.push(mk(yn));pays.unshift({id:yn,aid:yaid,iso:yv,n:yp.name,amt:ya,rm:yrm});
    ym.innerHTML='<p class="ok">'+(yp.t=="p"?"Paid to ":"Received from ")+yp.name+'. '+(yp.t=="p"?"Payable":"Receivable")+' is now '+rs(bal(yp))+'.</p>';
    document.getElementById("ya").value="";document.getElementById("yr").value="";return;
  }
  if(e.target.id=="cdb"){lv.clr=true;lv.note="";cdRender();return}
  if(ac=="cdn"){lv.clr=false;cdRender();return}
  if(ac=="cdy"){var cp=parties.filter(function(x){return x.id==lv.aid})[0];
    prods=prods.filter(function(x){return x.aid!=cp.id});pays=pays.filter(function(x){return x.aid!=cp.id});cp.e=[];
    lv.clr=false;lv.cat=null;lv.note="Data cleared.";ledgerList();return}
  var qr=e.target.closest("[data-qk]");if(qr){lv.cat=lv.cat===qr.dataset.qk?null:qr.dataset.qk;ledgerList();return}
  var t=e.target.closest("[data-v]");if(t)show(t.dataset.v,t.dataset.a);
});

M.addEventListener("change",function(e){if(e.target.classList.contains("pi")){var np2=parties.filter(function(x){return x.id==e.target.dataset.id})[0];np2.off=e.target.checked;nameArm=null;namesPage();return}

  if(e.target.id=="lf"||e.target.id=="lt"||e.target.id=="la"){lv.from=document.getElementById("lf").value;lv.to=document.getElementById("lt").value;lv.aid=+document.getElementById("la").value;lv.cat=null;lv.clr=false;lv.note="";ledgerList();return}

/* ===== Android app additions (design aur functions bilkul wahi hain) =====
   1) Data SQLite database me save hota hai (app band karne ke baad bhi rehta hai)
   2) Android ka Back button menu band karta hai / Dashboard par wapas jata hai */
var START_WITH_SAMPLE_DATA=true; /* false karein to app khali data se shuru hogi (sample naam/entries ke baghair) */
var dataReady=false,saveTimer=null,Store=null;
function snapshot(){return {parties:parties,cats:cats,scats:scats,prods:prods,pays:pays,nid:nid,pyid:pyid}}
function applyState(d){parties=d.parties;cats=d.cats;scats=d.scats;prods=d.prods;pays=d.pays;nid=d.nid;pyid=d.pyid}
/* Browser me test karne ya SQLite na chalne par: localStorage */
var localStore={
  init:function(){return Promise.resolve()},
  load:function(){try{var r=localStorage.getItem("tasbi.production.v1");return Promise.resolve(r?JSON.parse(r):null)}catch(e){return Promise.resolve(null)}},
  save:function(s){try{localStorage.setItem("tasbi.production.v1",JSON.stringify(s))}catch(e){}return Promise.resolve()}
};
function saveData(){
  if(!dataReady||!Store)return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){Store.save(snapshot()).catch(function(e){console.error("save failed",e)})},150);
}
function dbWarn(msg){
  var b=document.createElement("div");
  b.style.cssText="background:#A8273B;color:#fff;padding:8px 12px;font-size:13px";
  b.textContent=msg;
  document.getElementById("app").insertBefore(b,document.getElementById("main"));
}
function startApp(){
  var useDb=!!window.TasbiDb;
  Store=useDb?window.TasbiDb:localStore;
  Store.init().catch(function(e){
    console.error(e);
    if(useDb)dbWarn("SQLite open nahi hua ("+(e&&e.message||e)+"). Data phone me localStorage me save ho raha hai.");
    Store=localStore;
  }).then(function(){return Store.load()}).then(function(d){
    if(d)applyState(d);
    else if(!START_WITH_SAMPLE_DATA){parties=[];prods=[];pays=[];nid=0;pyid=0}
    dataReady=true;saveData();show("dash");
  }).catch(function(e){
    console.error(e);
    dbWarn("Data load nahi hua, is liye save band hai: "+(e&&e.message||e));
    show("dash");
  });
}
document.addEventListener("click",function(){setTimeout(saveData,0)});
document.addEventListener("change",function(){setTimeout(saveData,0)});
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="hidden"&&dataReady&&Store){clearTimeout(saveTimer);Store.save(snapshot())}
});
(function(){
  var A=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;
  if(!A||!A.addListener)return;
  A.addListener("backButton",function(){
    var app=document.getElementById("app");
    if(app.classList.contains("open")){app.classList.remove("open");return}
    if(!document.querySelector('.drawer a.on[data-go="dash"]')){show("dash");return}
    A.exitApp();
  });
})();
startApp();
</script>
